  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            halo: {
              bg: '#0A0B0F',
              surface: '#14151C',
              elevated: '#1E2029',
              border: '#2A2D38',
              'border-strong': '#3A3D4A',
              'on-surface': '#F2F4F8',
              'on-surface-muted': '#9AA0AE',
              'on-surface-faint': '#5C6170',
              primary: '#5B6BFF',
              'primary-hover': '#7886FF',
              'primary-pressed': '#4A59E6',
              success: '#2BE08C',
              warning: '#F5D547',
              info: '#3DD7E5',
              error: '#FF3A5C',
              focus: 'rgba(91, 107, 255, 0.35)'
            }
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
          },
          borderRadius: {
            'sm': '6px',
            'md': '10px',
            'lg': '16px',
            'xl': '24px'
          },
          boxShadow: {
            'halo-sm': '0 1px 0 rgba(255,255,255,0.02) inset, 0 1px 2px rgba(0,0,0,0.4)',
            'halo-md': '0 8px 24px rgba(0,0,0,0.45), 0 1px 0 rgba(255,255,255,0.03) inset',
            'halo-lg': '0 24px 60px rgba(0,0,0,0.55), 0 1px 0 rgba(255,255,255,0.04) inset',
            'halo-focus': '0 0 0 3px rgba(91, 107, 255, 0.35)'
          }
        },
      },
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #0A0B0F;
    }

    /* Space background radial glow spots */
    .space-glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.12;
      background: radial-gradient(circle, #5B6BFF 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* Animation */
    .animate-fade-in {
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Modal classes */
    .modal-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .modal-visible {
      opacity: 1;
      pointer-events: auto;
    }

    /* Toast entry animation */
    .toast-enter {
      animation: toastIn 0.24s cubic-bezier(0.2, 0.6, 0.2, 1);
    }

    @keyframes toastIn {
      from {
        transform: translateY(-20px) scale(0.95);
        opacity: 0;
      }
      to {
        transform: translateY(0) scale(1);
        opacity: 1;
      }
    }
  </style>
  <script>
    // Oturum Kontrolü (Giriş yapılmamışsa login'e yönlendir)
    const firmaDataStr = localStorage.getItem('firma');
    if (!firmaDataStr) {
      window.location.href = 'login.html';
    }
    const firma = JSON.parse(firmaDataStr);
  </script>
</head>

  <!-- Modal: Asistan Bağla -->

      <div class="flex justify-between items-center mb-4 border-b border-halo-border pb-3">

          İptal

        <button onclick="submitAsistanBagla()" 
          class="px-4 py-2 text-sm font-semibold text-white bg-halo-primary hover:bg-halo-primary-hover active:bg-halo-primary-pressed rounded-md transition shadow-halo-sm flex items-center gap-2">

  <!-- Bildirim Kutusu (Toast) -->
  <div id="toast" class="fixed top-6 right-6 z-50 hidden">
    <div id="toast-content"
      class="toast-enter flex items-center gap-3 px-5 py-4 rounded-md shadow-halo-lg border border-halo-border max-w-sm bg-halo-surface text-halo-on-surface">
      <i id="toast-icon" class="w-5 h-5 flex-shrink-0"></i>
      <div>
        <p id="toast-baslik" class="font-semibold text-sm"></p>
        <p id="toast-mesaj" class="text-sm mt-0.5 opacity-80"></p>
      </div>
      <button onclick="toastKapat()" class="ml-auto text-current opacity-40 hover:opacity-70 transition-opacity">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <script>
    // Dinamik API adresi
    const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? (window.location.port === '3001' ? window.location.origin : 'http://localhost:3001')
      : (window.location.protocol === 'file:' ? 'http://localhost:3001' : window.location.origin);

    // Toast göster
    function toastGoster(tur, baslik, mesaj) {
      const toast = document.getElementById('toast');
      const content = document.getElementById('toast-content');
      const icon = document.getElementById('toast-icon');
      const baslikEl = document.getElementById('toast-baslik');
      const mesajEl = document.getElementById('toast-mesaj');

      if (tur === 'basarili') {
        content.className = 'toast-enter flex items-center gap-3 px-5 py-4 rounded-md shadow-halo-lg border border-halo-success/20 max-w-sm bg-halo-surface text-halo-on-surface';
        icon.className = 'w-5 h-5 flex-shrink-0 text-halo-success';
        icon.setAttribute('data-lucide', 'check-circle');
      } else if (tur === 'hata') {
        content.className = 'toast-enter flex items-center gap-3 px-5 py-4 rounded-md shadow-halo-lg border border-halo-error/20 max-w-sm bg-halo-surface text-halo-on-surface';
        icon.className = 'w-5 h-5 flex-shrink-0 text-halo-error';
        icon.setAttribute('data-lucide', 'alert-circle');
      } else {
        content.className = 'toast-enter flex items-center gap-3 px-5 py-4 rounded-md shadow-halo-lg border border-halo-border max-w-sm bg-halo-surface text-halo-on-surface';
        icon.className = 'w-5 h-5 flex-shrink-0 text-halo-primary';
        icon.setAttribute('data-lucide', 'info');
      }

      baslikEl.textContent = baslik;
      mesajEl.textContent = mesaj;
      
      lucide.createIcons();
      toast.classList.remove('hidden');

      // Auto-hide
      if (window.toastTimeout) clearTimeout(window.toastTimeout);
      window.toastTimeout = setTimeout(() => toastKapat(), 5000);
    }

    function toastKapat() {
      document.getElementById('toast').classList.add('hidden');
    }

    // Modal aç / kapat
    function asistanBagla() {
      const modal = document.getElementById('modal-asistan-bagla');
      const card = modal.querySelector('.modal-card');
      modal.classList.remove('modal-hidden');
      modal.classList.add('modal-visible');
      setTimeout(() => {
        card.classList.remove('scale-95', 'opacity-0');
        card.classList.add('scale-100', 'opacity-100');
        document.getElementById('assistant-id-input').focus();
      }, 50);
    }

    function closeAsistanModal() {
      const modal = document.getElementById('modal-asistan-bagla');
      const card = modal.querySelector('.modal-card');
      card.classList.remove('scale-100', 'opacity-100');
      card.classList.add('scale-95', 'opacity-0');
      setTimeout(() => {
        modal.classList.remove('modal-visible');
        modal.classList.add('modal-hidden');
        document.getElementById('assistant-id-input').value = '';
      }, 150);
    }

    async function submitAsistanBagla() {
      const assistantIdInput = document.getElementById('assistant-id-input');
      const assistantId = assistantIdInput.value.trim();
      if (!assistantId) {
        toastGoster('hata', 'Giriş Hatası', 'Lütfen geçerli bir Asistan ID girin.');
        return;
      }

      try {
        const yanit = await fetch(API_URL + '/api/agents/assign', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ companyId: firma.id, assistantId: assistantId })
        });
        const veri = await yanit.json();

        if (yanit.ok) {
          toastGoster('basarili', 'Bağlantı Başarılı', veri.mesaj || "Asistan başarıyla bağlandı.");
          closeAsistanModal();
          ajanlariYukle(); // Listeyi yenile
        } else {
          toastGoster('hata', 'Bağlantı Başarısız', veri.hata || "Bilinmeyen bir hata oluştu.");
        }
      } catch (e) {
        toastGoster('hata', 'Bağlantı Hatası', 'Sunucuya bağlanırken hata oluştu.');
      }
    }

    // Vapi asistanlarını manuel senkronize et
    async function asistanlariSenkronizeEt() {
      const btn = document.getElementById('btn-sync');
      const icon = btn ? btn.querySelector('[data-lucide="refresh-cw"]') : null;
      
      if (btn) btn.disabled = true;
      if (icon) icon.classList.add('animate-spin');
      
      try {
        const yanit = await fetch(API_URL + '/api/vapi/assistants/sync', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ companyId: firma.id })
        });
        const veri = await yanit.json();
        
        if (yanit.ok) {
          toastGoster('basarili', 'Senkronizasyon Başarılı', veri.mesaj || "Asistan bilgileri başarıyla güncellendi.");
          await ajanlariYukle();
        } else {
          toastGoster('hata', 'Senkronizasyon Başarısız', veri.hata || "Bilinmeyen bir hata oluştu.");
        }
      } catch (e) {
        toastGoster('hata', 'Senkronizasyon Hatası', 'Sunucuya bağlanırken hata oluştu.');
      } finally {
        if (btn) btn.disabled = false;
        if (icon) icon.classList.remove('animate-spin');
      }
    }

    // Vapi asistanlarını backend'den çek ve kartlara doldur
    async function ajanlariYukle() {
      const grid = document.getElementById('agents-grid');
      try {
        const yanit = await fetch(API_URL + '/api/vapi/assistants?companyId=' + firma.id);
        const veri = await yanit.json();

        grid.innerHTML = '';

        if (!veri || veri.length === 0) {
          grid.innerHTML = `
            <div class="col-span-full py-12 px-4 border border-dashed border-halo-border rounded-lg text-center bg-halo-surface/30">
              <i data-lucide="headset" class="w-10 h-10 text-halo-on-surface-faint mx-auto mb-3"></i>
              <h3 class="text-md font-semibold text-halo-on-surface mb-1">Henüz Ajan Bulunmuyor</h3>
              <p class="text-sm text-halo-on-surface-muted max-w-sm mx-auto mb-5">Vapi asistanlarınızı bağlayarak yapay zeka aramalarını izleyebilir ve yönetebilirsiniz.</p>
              <button onclick="asistanBagla()" class="px-4 py-2 bg-halo-primary/10 border border-halo-primary/20 hover:bg-halo-primary/20 text-halo-primary text-sm font-semibold rounded-md transition shadow-halo-sm inline-flex items-center gap-2">
                <i data-lucide="plus" class="w-4 h-4"></i> İlk Asistanı Bağla
              </button>
            </div>
          `;
          lucide.createIcons();
          return;
        }

        veri.forEach(a => {
          const isim = a.name || 'İsimsiz Ajan';
          const model = a.model?.model || '-';
          const ses = a.voice?.voiceId || a.voice?.voice || '-';
          const aciklama = a.firstMessage ? (a.firstMessage.length > 80 ? a.firstMessage.substring(0, 80) + '...' : a.firstMessage) : 'Açıklama veya ilk mesaj girilmemiş.';

          grid.innerHTML += `
            <div class="bg-halo-surface border border-halo-border rounded-lg p-6 shadow-halo-sm hover:border-halo-border-strong hover:bg-halo-elevated transition-all duration-200 group animate-fade-in relative overflow-hidden flex flex-col justify-between min-h-[320px]">
              
              <div>
                <div class="flex justify-between items-start mb-4">
                  <div class="p-3 bg-halo-primary/10 border border-halo-primary/20 rounded-md group-hover:bg-halo-primary/25 transition-colors">
                    <i data-lucide="headset" class="w-6 h-6 text-halo-primary"></i>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-halo-success/10 text-halo-success border border-halo-success/20">Aktif</span>
                  </div>
                </div>
                
                <h3 class="text-lg font-bold text-halo-on-surface leading-tight">${isim}</h3>
                <p class="text-sm text-halo-on-surface-muted mt-2 leading-relaxed italic">"${aciklama}"</p>
              </div>

              <div>
                <div class="mt-5 space-y-2 bg-halo-bg p-3.5 rounded-md border border-halo-border font-mono text-xs">
                  <div class="flex items-center justify-between">
                    <span class="text-halo-on-surface-faint flex items-center gap-1.5"><i data-lucide="mic" class="w-3.5 h-3.5"></i> Ses ID</span>
                    <span class="font-medium text-halo-on-surface-muted truncate max-w-[160px]" title="${ses}">${ses}</span>
                  </div>
                  <div class="flex items-center justify-between">
                    <span class="text-halo-on-surface-faint flex items-center gap-1.5"><i data-lucide="cpu" class="w-3.5 h-3.5"></i> Model</span>
                    <span class="font-medium text-halo-on-surface-muted">${model}</span>
                  </div>
                </div>

                <div class="mt-6 flex gap-3">
                  <button onclick="toastGoster('bilgi', 'Test Etme', 'Yakında sizlerle...')"
                    class="flex-1 px-3 py-2 text-sm font-semibold text-halo-on-surface-muted bg-halo-surface hover:text-halo-on-surface hover:bg-halo-surface/80 rounded-md border border-halo-border hover:border-halo-border-strong transition shadow-halo-sm flex items-center justify-center gap-2">
                    <i data-lucide="play" class="w-3.5 h-3.5"></i> Test Et
                  </button>
                  <button onclick="toastGoster('bilgi', 'Yapılandırma', 'Yakında sizlerle...')"
                    class="flex-1 px-3 py-2 text-sm font-semibold text-white bg-halo-primary hover:bg-halo-primary-hover active:bg-halo-primary-pressed rounded-md transition shadow-halo-sm flex items-center justify-center gap-2">
                    <i data-lucide="sliders" class="w-3.5 h-3.5"></i> Yapılandır
                  </button>
                </div>
              </div>
            </div>
          `;
        });
        lucide.createIcons();
      } catch (e) {
        grid.innerHTML = '<div class="col-span-full p-4 border border-halo-error/20 bg-halo-surface/30 text-halo-error text-sm rounded-lg">Sunucuya bağlanılamadı. Lütfen sunucunun çalıştığından emin olun.</div>';
      }
    }

    // Kullanıcı bilgilerini Header'a yerleştir
    function headerVerileriniDoldur() {
      if (!firma) return;
      const avatarUrl = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(firma.firma_adi) + '&background=14151C&color=5B6BFF';
      const headerIsim = document.getElementById('header-isim');
      const headerAvatar = document.getElementById('header-avatar');

      if (headerIsim) headerIsim.textContent = firma.firma_adi;
      if (headerAvatar) headerAvatar.src = avatarUrl;
    }

    headerVerileriniDoldur();

    // Çıkış Yap
    document.getElementById('btn-logout').addEventListener('click', () => {
      localStorage.removeItem('firma');
      window.location.href = 'login.html';
    });

    // İkonları başlat ve asistanları yükle
    lucide.createIcons();
    ajanlariYukle();
  </script>
</body>

</html>
