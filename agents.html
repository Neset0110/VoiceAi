<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sesli AI Kontrol Paneli</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            slate: {
              850: '#1e293b',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
    }

    /* Animation */
    .animate-fade-in {
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
  <script>
    // Oturum Kontrolü (Giriş yapılmamışsa login'e yönlendir)
    const firmaDataStr = localStorage.getItem('firma');
    if (!firmaDataStr) {
      window.location.href = 'login.html';
    }
    const firma = JSON.parse(firmaDataStr);
  </script>
</head>

<body class="text-slate-900">

  <div class="min-h-screen bg-slate-50 flex flex-col">

    <!-- Top Navigation Bar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">

        <!-- Logo -->
        <div class="flex items-center gap-2">
          <div class="bg-indigo-600 p-1.5 rounded-lg">
            <i data-lucide="mic-2" class="w-5 h-5 text-white"></i>
          </div>
          <span class="text-lg font-bold text-slate-900 tracking-tight">VoiceAuto<span
              class="text-indigo-600">.ai</span></span>
        </div>


        <!-- Nav Links -->
        <nav class="hidden md:flex items-center gap-1">
          <a href="index.html" id="nav-dashboard"
            class="nav-btn flex items-center gap-2 px-3 py-2 text-sm font-medium text-slate-600 hover:text-indigo-600 hover:bg-slate-50 rounded-md transition-colors">
            <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
            Kontrol Paneli
          </a>
          <a href="agents.html" id="nav-agents"
            class="nav-btn flex items-center gap-2 px-3 py-2 text-sm font-medium text-indigo-600 bg-indigo-50 rounded-md transition-colors">
            <i data-lucide="users" class="w-4 h-4"></i>
            Ajanlar
          </a>
          <a href="settings.html" id="nav-settings"
            class="nav-btn flex items-center gap-2 px-3 py-2 text-sm font-medium text-slate-600 hover:text-indigo-600 hover:bg-slate-50 rounded-md transition-colors">
            <i data-lucide="settings" class="w-4 h-4"></i>
            Ayarlar
          </a>
        </nav>

        <!-- User Profile -->
        <div class="flex items-center gap-4">
          <div class="flex items-center gap-3">
            <div class="text-right hidden sm:block">
              <p class="text-sm font-medium text-slate-900" id="header-isim">Yükleniyor...</p>
              <p class="text-xs text-slate-500">İşletme Sahibi</p>
            </div>
            <div class="w-9 h-9 bg-slate-200 rounded-full border border-slate-300 overflow-hidden">
              <img id="header-avatar" src="https://ui-avatars.com/api/?name=A&background=e0e7ff&color=4f46e5"
                alt="Avatar" class="w-full h-full object-cover" />
            </div>
          </div>
          <button id="btn-logout" class="text-slate-400 hover:text-slate-600">
            <i data-lucide="log-out" class="w-5 h-5"></i>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">

      <!-- ==================== VIEW: AGENTS ==================== -->
      <div id="view-agents" class="space-y-8 animate-fade-in">
        <!-- Header Section -->
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Ajanları Yönet</h1>
            <p class="text-slate-500 mt-1">Yapay zeka asistanlarınızı yapılandırın, komutlarını ve ses özelliklerini
              ayarlayın.
            </p>
          </div>
          <button onclick="asistanBagla()"
            class="px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-semibold shadow-sm hover:bg-indigo-700 transition flex items-center gap-2">
            <i data-lucide="plus" class="w-4 h-4"></i> Asistan Bağla
          </button>
        </div>

        <!-- Agents Grid (Vapi API'den dinamik doldurulur) -->
        <div id="agents-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          <!-- Yükleniyor Skeleton -->
          <div class="skeleton-card bg-white border border-slate-200 rounded-xl p-6 shadow-sm animate-pulse">
            <div class="flex justify-between items-start mb-4">
              <div class="w-12 h-12 bg-slate-200 rounded-lg"></div>
              <div class="w-16 h-6 bg-slate-200 rounded-full"></div>
            </div>
            <div class="h-5 bg-slate-200 rounded w-3/4 mb-2"></div>
            <div class="h-4 bg-slate-100 rounded w-full"></div>
            <div class="mt-4 space-y-3 bg-slate-50 p-3 rounded-lg">
              <div class="h-4 bg-slate-200 rounded w-full"></div>
              <div class="h-4 bg-slate-200 rounded w-full"></div>
            </div>
          </div>
          <div
            class="skeleton-card bg-white border border-slate-200 rounded-xl p-6 shadow-sm animate-pulse hidden md:block">
            <div class="flex justify-between items-start mb-4">
              <div class="w-12 h-12 bg-slate-200 rounded-lg"></div>
              <div class="w-16 h-6 bg-slate-200 rounded-full"></div>
            </div>
            <div class="h-5 bg-slate-200 rounded w-3/4 mb-2"></div>
            <div class="h-4 bg-slate-100 rounded w-full"></div>
            <div class="mt-4 space-y-3 bg-slate-50 p-3 rounded-lg">
              <div class="h-4 bg-slate-200 rounded w-full"></div>
              <div class="h-4 bg-slate-200 rounded w-full"></div>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script>
    // Dinamik API adresi: Yerelde Live Server veya dosya protokolu ile çalışırken localhost:3001'e gider.
    // Canlıda (deploy edildiğinde) frontend ve backend aynı sunucuda çalışacağından origin'i kullanır.
    const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? (window.location.port === '3001' ? window.location.origin : 'http://localhost:3001')
      : (window.location.protocol === 'file:' ? 'http://localhost:3001' : window.location.origin);

    // Vapi asistanlarını backend'den çek ve kartlara doldur
    async function ajanlariYukle() {
      const grid = document.getElementById('agents-grid');
      try {
        const yanit = await fetch(API_URL + '/api/vapi/assistants?companyId=' + firma.id);
        const veri = await yanit.json();

        grid.innerHTML = '';

        veri.forEach(a => {
          const isim = a.name || 'İsimsiz Ajan';
          const model = a.model?.model || '-';
          const ses = a.voice?.voiceId || a.voice?.voice || '-';
          const aciklama = a.firstMessage ? a.firstMessage.substring(0, 80) + '...' : '';

          grid.innerHTML += `
            <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm hover:shadow-md transition-shadow group animate-fade-in">
              <div class="flex justify-between items-start mb-4">
                <div class="p-3 bg-indigo-50 rounded-lg group-hover:bg-indigo-100 transition-colors">
                  <i data-lucide="headset" class="w-6 h-6 text-indigo-600"></i>
                </div>
                <div class="flex items-center gap-2">
                  <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-100">Aktif</span>
                </div>
              </div>
              <h3 class="text-lg font-bold text-slate-900">${isim}</h3>
              <p class="text-sm text-slate-500 mt-1">${aciklama}</p>

              <div class="mt-4 space-y-3 bg-slate-50 p-3 rounded-lg border border-slate-100">
                <div class="flex items-center justify-between text-sm">
                  <span class="text-slate-500 flex items-center gap-1"><i data-lucide="mic" class="w-3 h-3"></i> Ses</span>
                  <span class="font-medium text-slate-700">${ses}</span>
                </div>
                <div class="flex items-center justify-between text-sm">
                  <span class="text-slate-500 flex items-center gap-1"><i data-lucide="cpu" class="w-3 h-3"></i> Model</span>
                  <span class="font-medium text-slate-700">${model}</span>
                </div>
              </div>

              <div class="mt-6 flex gap-3">
                <button onclick="alert('Yakında')"
                  class="flex-1 px-3 py-2 text-sm font-medium text-slate-600 bg-white hover:bg-slate-50 rounded-lg transition-colors border border-slate-200 shadow-sm flex items-center justify-center gap-2">
                  <i data-lucide="play" class="w-3 h-3"></i> Test Et
                </button>
                <button onclick="alert('Yakında')"
                  class="flex-1 px-3 py-2 text-sm font-medium text-white bg-slate-900 hover:bg-slate-800 rounded-lg transition-colors shadow-sm">Yapılandır</button>
              </div>
            </div>
          `;
        });
        lucide.createIcons();
      } catch (e) {
        grid.innerHTML = '<p class="text-red-500 text-sm p-4">Sunucuya bağlanılamadı.</p>';
      }
    }

    // Ajan Bağlama Fonksiyonu
    async function asistanBagla() {
      const assistantId = prompt("Lütfen Vapi'den aldığınız Asistan ID'sini giriniz (örn: f3c3...):");
      if (!assistantId) return;

      try {
        const yanit = await fetch(API_URL + '/api/agents/assign', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ companyId: firma.id, assistantId: assistantId.trim() })
        });
        const veri = await yanit.json();

        if (yanit.ok) {
          alert("Başarılı: " + veri.mesaj);
          ajanlariYukle(); // Listeyi yenile
        } else {
          alert("Hata: " + veri.hata);
        }
      } catch (e) {
        alert("Sunucuya bağlanırken hata oluştu.");
      }
    }

    // Kullanıcı bilgilerini Header'a yerleştir
    function headerVerileriniDoldur() {
      if (!firma) return;
      const avatarUrl = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(firma.firma_adi) + '&background=e0e7ff&color=4f46e5';
      const headerIsim = document.getElementById('header-isim');
      const headerAvatar = document.getElementById('header-avatar');

      if (headerIsim) headerIsim.textContent = firma.firma_adi;
      if (headerAvatar) headerAvatar.src = avatarUrl;
    }

    headerVerileriniDoldur();

    // Çıkış Yap
    document.getElementById('btn-logout').addEventListener('click', () => {
      localStorage.removeItem('firma');
      window.location.href = 'login.html';
    });

    // İkonları başlat ve asistanları yükle
    lucide.createIcons();
    ajanlariYukle();
  </script>
</body>

</html>
